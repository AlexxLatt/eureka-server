server:
    port: 8761 # Стандартный порт для Eureka Server

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false # Сервер не должен регистрировать сам себя
    fetch-registry: false       # Серверу не нужно скачивать реестр (он же один)